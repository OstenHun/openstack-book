  navbar:
    background: primary
    search: true
    right:
      - icon: github
        href: https://github.com/openstack-kr/openstack-book
      - icon: facebook
        href: https://www.facebook.com/groups/openstack-kr
      - icon: discord
        href: https://discord.gg/3ZzKMJKtPg
      - icon: chat-square-text
        href: https://forum.openinfra-kr.org/
  sidebar:
    style: docked
    search: true
    contents:
      - text: "목록"
        contents:
        - text: "목차"
          file: lectures/index.qmd
        - text: "1장. 오픈스택 개요"
          file: lectures/ch1_lec.qmd
        - text: "2장. 오픈스택 설치 가이드"
          file: lectures/ch2_lec.qmd
        - section: "6장. Neutron"
          file: lectures/ch6_lec.qmd
          contents:
            - text: "6-1. Neutron의 agent에 대해 알아보기"
              file: lectures/ch6/neutron_agents.qmd
            - text: "6-12. SNAT/DNAT란?"
              file: lectures/ch6/snat_dnat.qmd
            - text: "6-15. OVS와 VXLAN를 이용해 가상 네트워크 만들기"
              file: lectures/ch6/ovs_vxlan_vpn.qmd
        - section: "7장. Cinder"
          file: lectures/ch7_lec.qmd
          contents:
            - text: "7-1. Cinder 개요와 Volume 기본 사용"
              file: lectures/ch7/ch7_1_lec.qmd
            - text: "7-2. 이미지 기반 Volume과 Snapshot 흐름"
              file: lectures/ch7/ch7_2_lec.qmd
            - text: "7-3. Backend Driver 구조와 LVM 확인"
              file: lectures/ch7/ch7_3_lec.qmd
            - text: "7-4. Boot from Volume 시나리오"
              file: lectures/ch7/ch7_4_lec.qmd





format:
